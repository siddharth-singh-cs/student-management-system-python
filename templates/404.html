{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}
{% block page_title %}Error 404{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-12 col-md-8 col-lg-6 text-center">
        <div class="card p-5 border-0 shadow-sm">
            <div class="display-1 text-primary fw-bold mb-3">404</div>
            <h4 class="fw-bold text-dark mb-2">Page Not Found</h4>
            <p class="text-muted mb-4">
                The resource or student record you are looking for does not exist or may have been removed.
            </p>
            <div>
                <a href="{{ url_for('dashboard') }}" class="btn btn-primary d-inline-flex align-items-center gap-2 px-4 py-2">
                    <i class="bi bi-grid-1x2-fill"></i>
                    <span>Back to Dashboard</span>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
